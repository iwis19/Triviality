name: Imported backend

on:
  push:
    branches: [main]
    paths:
      - "external/norththehackers/**"
      - "scripts/backend.mjs"
      - "package.json"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "external/norththehackers/**"
      - "scripts/backend.mjs"
      - "package.json"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -e './external/norththehackers/backend[dev]'
      - run: node scripts/backend.mjs check
      - run: node scripts/backend.mjs test
  explorer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: external/norththehackers/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: external/norththehackers/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
